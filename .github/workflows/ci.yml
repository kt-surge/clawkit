name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check committed whitespace
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          } elseif ("${{ github.event.before }}" -and "${{ github.event.before }}" -notmatch '^0+$') {
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          } else {
            git show --check --oneline "${{ github.sha }}"
          }
      - name: Clean verify
        run: |
          mvn -B -ntp clean verify "-Dgroups=!e2e" 2>&1 | Tee-Object -FilePath ci-clean-verify.log
          exit $LASTEXITCODE
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        run: |
          $reports = Get-ChildItem -Path . -Recurse -Filter 'TEST-*.xml' |
            Where-Object { $_.FullName -match '[\\/]surefire-reports[\\/]' }
          $reported = 0
          foreach ($report in $reports) {
            [xml]$suite = Get-Content -LiteralPath $report.FullName -Raw
            foreach ($test in $suite.testsuite.testcase) {
              foreach ($problem in @($test.failure) + @($test.error)) {
                if ($null -eq $problem) { continue }
                $message = "$($test.classname).$($test.name): $($problem.message)"
                if ($message.Length -gt 1200) { $message = $message.Substring(0, 1200) }
                $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Failed test::$message"
                $reported++
              }
            }
          }
          if ($reported -eq 0 -and (Test-Path -LiteralPath ci-clean-verify.log)) {
            $errors = Select-String -LiteralPath ci-clean-verify.log -Pattern '^\[ERROR\]' |
              Select-Object -Last 12
            foreach ($entry in $errors) {
              $message = $entry.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Build failure::$message"
            }
          }
      - name: Runtime baseline compare
        run: mvn -B -ntp -pl clawkit-evaluation -am -Pbenchmark verify "-Dbenchmark.mode=compare"
      - name: Ensure build did not modify tracked files
        run: git diff --exit-code

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build image
        run: docker build -t clawkit:ci .
      - name: Smoke help and version
        run: |
          docker run --rm clawkit:ci --help
          docker run --rm clawkit:ci --version
      - name: Verify workspace and persistent state mounts
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            --entrypoint sh clawkit:ci \
            -c 'test "$PWD" = /workspace && test -r pom.xml && test ! -w pom.xml'
          docker volume create clawkit-ci-home
          docker run --rm \
            -v clawkit-ci-home:/home/clawkit/.clawkit \
            --entrypoint sh clawkit:ci \
            -c 'touch /home/clawkit/.clawkit/write-test && rm /home/clawkit/.clawkit/write-test'
          docker volume rm clawkit-ci-home
      - name: Verify non-root and no-TTY fail-closed behavior
        run: |
          test "$(docker run --rm --entrypoint id clawkit:ci -u)" != "0"
          set +e
          output="$(docker run --rm -e CLAWKIT_API_KEY=ci-placeholder clawkit:ci 2>&1)"
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
          grep -q '\[C-007\]' <<< "$output"
